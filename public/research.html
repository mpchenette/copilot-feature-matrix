<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>References - GitHub Copilot Feature Matrix</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 18px;
            line-height: 1.6;
            color: #2a2a2a;
            background: #f8f7f4;
            padding: 0;
        }

        header {
            padding: 60px 40px 40px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 40px;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 1px;
            background: #d4d2ca;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            font-size: 18px;
            color: #6b6b6b;
            text-decoration: none;
            transition: color 0.15s;
        }

        nav a:hover {
            color: #2a2a2a;
        }

        main {
            padding: 60px 40px 120px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .loading {
            text-align: center;
            padding: 120px 0;
            color: #6b6b6b;
            font-size: 16px;
        }

        /* Research content styles */
        #researchContent h2,
        #researchContent h3 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #2a2a2a;
        }

        #researchContent h2 {
            font-size: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #d4d2ca;
        }

        #researchContent h3 {
            font-size: 1.25rem;
        }

        #researchContent p,
        #researchContent li {
            color: #6b6b6b;
            line-height: 1.7;
        }

        #researchContent ul,
        #researchContent ol {
            margin: 1rem 0 1rem 1.5rem;
            padding-left: 1rem;
        }

        #researchContent li {
            margin: 0.5rem 0;
        }

        #researchContent a {
            color: #2a2a2a;
            text-decoration: underline;
            transition: opacity 0.15s;
        }

        #researchContent a:hover {
            opacity: 0.7;
        }

        #researchContent code {
            background: #e8e7e2;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        #researchContent pre {
            background: #e8e7e2;
            border: 1px solid #d4d2ca;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
            border-radius: 3px;
        }

        #researchContent pre code {
            background: none;
            padding: 0;
        }

        a:focus-visible {
            outline: 2px solid #2a2a2a;
            outline-offset: 2px;
        }

        @media (max-width: 768px) {
            header {
                padding: 40px 24px 24px;
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            h1 {
                font-size: 26px;
            }

            nav {
                gap: 16px;
            }

            main {
                padding: 40px 24px 80px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>References</h1>
        <nav>
            <a href="index.html">Back</a>
        </nav>
    </header>

    <main id="researchContent">
        <div class="loading">Loading references...</div>
    </main>

    <script src="research.js"></script>
</body>
</html>
